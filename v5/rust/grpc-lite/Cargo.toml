[package]
name = "tencent-rocketmq5-lite-demo"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# crates.io 上已发布的 rocketmq 5.0.0 不支持 Lite Topic，这里依赖 apache/rocketmq-clients 未发布的 master 代码。
# 跟踪 master 分支，实际使用的 commit 由提交到仓库的 Cargo.lock 锁定；更新方式见 README。
# 待支持 Lite Topic 的版本发布后改为 crates.io 版本。
rocketmq = { git = "https://github.com/apache/rocketmq-clients.git", branch = "master" }
tokio = { version = "1", features = ["full"] }
