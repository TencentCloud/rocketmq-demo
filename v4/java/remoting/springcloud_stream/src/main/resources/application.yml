spring:
  cloud:
    function:
      # 消费函数名称，每个函数对应一个 <函数名>-in-0 binding；不需要的场景可以从这里去掉，避免去创建对应的 Topic 和消费组
      definition: topicTag1;topicTag2;retryConsumer;txConsumer;broadcastConsumer;orderlyConsumer
    stream:
      rocketmq:
        binder:
          # 服务地址全称
          name-server: rocketmq-xxx.rocketmq.ap-bj.public.tencenttdmq.com:9876
          # 角色名称
          secret-key: admin
          # 角色密钥
          access-key: eyJrZXlJZ...
          # namespace全称
          namespace: rocketmq-xxx|namespace1
          # producer group
          group: producerGroup
        bindings:
          # binding名称, 与spring.cloud.stream.bindings下的binding名称对应
          topicTag1-in-0:
            consumer:
              # 订阅的tag类型，根据消费者实际情况进行配置（默认是订阅所有消息）
              subscription: TAG1
          # binding名称
          topicTag2-in-0:
            consumer:
              subscription: TAG2
          # 重试消息：RocketMQ 服务端重试配置（仅集群模式生效）
          retryConsumer-in-0:
            consumer:
              push:
                # 最大重试次数，超过后进入死信队列 %DLQ%retry-consumer-group
                # 注意：binder 默认值是 0（首次失败直接进死信），-1 表示 RocketMQ 默认的 16 次，需要重试时必须显式配置
                max-reconsume-times: 3
                # 下次重试的延迟级别，0 表示由服务端按重试次数递增（首次 10s、然后 30s、1m ...），-1 表示不重试直接进死信
                delay-level-when-next-consume: 0
          # 事务消息：生产者使用 TransactionMQProducer
          txProducer-out-0:
            producer:
              # 事务生产者组，服务端按生产者组回查本地事务状态，建议与普通生产者组分开
              group: tx-producer-group
              # 生产者类型：Normal（默认）/ Trans（事务）
              producer-type: Trans
              # 事务监听器的 Spring Bean 名称（实现 org.apache.rocketmq.client.producer.TransactionListener）
              transaction-listener: streamTransactionListener
          # 广播消息：消费模式设为广播，同一消费组的每个实例都收到全部消息（默认 CLUSTERING 集群模式）
          broadcastConsumer-in-0:
            consumer:
              message-model: BROADCASTING
          # 顺序消息：生产者按业务 key 选择队列
          orderlyProducer-out-0:
            producer:
              # 队列选择器的 Spring Bean 名称（实现 org.apache.rocketmq.client.producer.MessageQueueSelector）
              message-queue-selector: orderMessageQueueSelector
          # 顺序消息：消费者使用顺序监听（MessageListenerOrderly）
          orderlyConsumer-in-0:
            consumer:
              push:
                orderly: true
                # 顺序消费失败后暂停当前队列的时间（毫秒），之后在客户端本地重试
                suspend-current-queue-time-millis: 1000
                # 顺序消费最大重试次数，超过后进入死信队列；binder 默认 0（首次失败就进死信），-1 表示无限重试
                max-reconsume-times: 3
      bindings:
        # binding名称，生产者通过 StreamBridge 发送到 topicSend-out-0
        topicSend-out-0:
          # 指定topic, 对应创建的topic名称
          destination: TopicTest
          content-type: application/json
        # binding名称，消费者函数 topicTag1 的输入 binding
        topicTag1-in-0:
          destination: TopicTest
          content-type: application/json
          group: consumer-group1
        # binding名称，消费者函数 topicTag2 的输入 binding
        topicTag2-in-0:
          destination: TopicTest
          content-type: application/json
          group: consumer-group2
        # 重试消息：生产者（Topic 类型：普通）
        retryProducer-out-0:
          destination: TopicRetry
        # 重试消息：消费者
        retryConsumer-in-0:
          destination: TopicRetry
          group: retry-consumer-group
          consumer:
            # Spring Cloud Stream 本地重试次数（默认 3）：在同一消费线程内立即重放，消息不回到服务端，也不增加 reconsumeTimes。
            # 全部失败后才返回 RECONSUME_LATER 触发 RocketMQ 服务端重试；这里设为 1 关闭本地重试，只演示服务端重试。
            max-attempts: 1
        # 事务消息：生产者（Topic 类型：事务）
        txProducer-out-0:
          destination: TopicTransaction
        # 事务消息：消费者
        txConsumer-in-0:
          destination: TopicTransaction
          group: tx-consumer-group
        # 广播消息：生产者（Topic 类型：普通）
        broadcastProducer-out-0:
          destination: TopicBroadcast
        # 广播消息：消费者
        broadcastConsumer-in-0:
          destination: TopicBroadcast
          group: broadcast-consumer-group
        # 顺序消息：生产者（Topic 类型：顺序，全局顺序或局部顺序）
        orderlyProducer-out-0:
          destination: TopicOrderly
        # 顺序消息：消费者
        orderlyConsumer-in-0:
          destination: TopicOrderly
          group: orderly-consumer-group
